  <!--
    省錢情報。改版面前先讀 STYLE.md。
    優惠在 deals.json，請用 scripts/deals.py，不要手改。
  -->
  <style>
    :root {
      color-scheme: light;
      --bg: #e6f2e8;
      --fg: #13261c;
      --muted: #4f6558;
      --paper: #f7fbf8;
      --line: #c9ddd0;
      --mast: #0b6a3c;
      --mast-fg: #f4fff8;
      --mast-muted: #d7f3e3;
      --tag: #ffd2c4;
      --urgent: #c2410c;
      --urgent-ink: #fff7f4;
      --soon-fill: #fff4e5;
      --soon-ink: #8a3d08;
      --soon-line: #e8b48a;
      --later-fill: #e5f6ea;
      --later-ink: #0b6a3c;
      --later-line: #0b6a3c;
      --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #0c1410;
        --fg: #e7f6ec;
        --muted: #b7cfc0;
        --paper: #15211b;
        --line: #2c4034;
        --mast: #072818;
        --mast-fg: #f3fff6;
        --mast-muted: #c5e6d4;
        --tag: #ffb59a;
        --urgent: #ff7a55;
        --urgent-ink: #3a120c;
        --soon-fill: #3a2714;
        --soon-ink: #ffd7b0;
        --soon-line: #c4894a;
        --later-fill: #143226;
        --later-ink: #7ddea6;
        --later-line: #3dce7a;
      }
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--sans);
      line-height: 1.5;
    }

    .svg-sprite {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
    }

    .masthead {
      background: var(--mast);
      color: var(--mast-fg);
      border-top: 6px solid var(--urgent);
      padding: 1.65rem 0 1.35rem;
    }

    .wrap {
      width: min(48rem, 100%);
      margin: 0 auto;
      padding: 0 1.2rem;
    }

    .kicker {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      margin: 0 0 0.45rem;
      color: var(--tag);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.16em;
    }

    .kicker svg {
      display: block;
      width: 1.05rem;
      height: 1.05rem;
    }

    h1 {
      margin: 0;
      font-family: var(--sans);
      font-size: clamp(2rem, 7vw, 2.7rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.12;
    }

    .dek {
      max-width: 34rem;
      margin: 0.85rem 0 0;
      color: var(--mast-muted);
      font-size: 0.98rem;
    }

    main { padding: 1.25rem 0 4rem; }

    .status { color: var(--muted); margin: 0 0 0.8rem; }

    .updated {
      margin: 0 0 0.75rem;
      color: var(--muted);
      font-size: 0.82rem;
      font-variant-numeric: tabular-nums;
    }

    .chips-bar {
      position: sticky;
      top: 0;
      z-index: 5;
      margin: 0 0 1rem;
      padding: 0.55rem 0 0.65rem;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
    }

    .chips {
      display: flex;
      gap: 0.45rem;
      max-width: 100%;
      margin: 0;
      padding: 0;
      overflow-x: auto;
      overscroll-behavior-x: contain;
      list-style: none;
      scrollbar-width: none;
    }

    .chips::-webkit-scrollbar { display: none; }

    .chip {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      flex: none;
      min-height: 2.5rem;
      border: 1px solid transparent;
      border-radius: 999px;
      padding: 0.28rem 0.85rem 0.28rem 0.28rem;
      background: var(--fill);
      color: var(--ink);
      font-size: 0.82rem;
      font-weight: 700;
      white-space: nowrap;
      text-decoration: none;
    }

    .chip-all {
      --fill: var(--paper);
      --ink: var(--fg);
      --mark: var(--mast);
      --mark-ink: var(--mast-fg);
      border-color: var(--line);
    }

    a.chip,
    a.chip:visited { color: var(--ink); }

    a.chip:hover { text-decoration: underline; text-underline-offset: 0.16em; }

    a.chip:focus-visible {
      outline: 2px solid var(--urgent);
      outline-offset: 3px;
    }

    .chip[aria-selected="true"] {
      background: var(--mark);
      border-color: var(--mark);
    }

    a.chip[aria-selected="true"],
    a.chip[aria-selected="true"]:visited { color: var(--mark-ink); }

    .chip[aria-selected="true"] .mark {
      background: var(--mark-ink);
      color: var(--mark);
    }

    .mark {
      display: grid;
      place-items: center;
      flex: none;
      background: var(--mark);
      color: var(--mark-ink);
    }

    .mark svg { display: block; width: 1.15rem; height: 1.15rem; }

    .chip .mark {
      width: 1.7rem;
      height: 1.7rem;
      border-radius: 999px;
    }

    .chip .mark svg { width: 0.95rem; height: 0.95rem; }

    .group {
      margin: 0 0 1.35rem;
      scroll-margin-top: 3.6rem;
      min-width: 0;
    }

    .group h2 {
      display: flex;
      width: fit-content;
      align-items: center;
      gap: 0.4rem;
      margin: 0 0 0.75rem;
      padding: 0.22rem 0.72rem 0.22rem 0.22rem;
      border-radius: 999px;
      background: var(--fill);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 0.92rem;
      font-weight: 800;
      letter-spacing: 0;
      line-height: 1.2;
    }

    .group h2 .mark {
      width: 1.7rem;
      height: 1.7rem;
      border-radius: 999px;
    }

    .group h2 .mark svg { width: 0.95rem; height: 0.95rem; }

    .deals {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .deals li {
      background: var(--paper);
      color: var(--fg);
      border: 1px solid var(--line);
      border-left: 4px solid var(--mark);
      border-radius: 0.85rem;
      padding: 0.8rem 0.9rem 0.85rem;
      margin: 0 0 0.7rem;
      min-width: 0;
    }

    .deals li.is-urgent { border-left-color: var(--urgent); }

    .title-link {
      color: var(--fg);
      font-size: 1.05rem;
      font-weight: 800;
      text-decoration: none;
      overflow-wrap: anywhere;
    }

    a.title-link:hover { text-decoration: underline; text-underline-offset: 0.18em; }

    a.title-link:focus-visible,
    .note a:focus-visible {
      outline: 2px solid var(--mark);
      outline-offset: 3px;
      border-radius: 0.3rem;
    }

    .expiry {
      display: block;
      width: fit-content;
      margin: 0 0 0.45rem;
      padding: 0.2rem 0.62rem;
      border-radius: 999px;
      font-size: 0.92rem;
      font-weight: 800;
      letter-spacing: 0.01em;
      line-height: 1.35;
    }

    .expiry.is-urgent {
      background: var(--urgent);
      color: var(--urgent-ink);
      border: 1px solid var(--urgent);
    }

    .expiry.is-soon {
      background: var(--soon-fill);
      color: var(--soon-ink);
      border: 1px solid var(--soon-line);
    }

    .expiry.is-later {
      background: var(--later-fill);
      color: var(--later-ink);
      border: 1px solid var(--later-line);
    }

    .note {
      margin: 0.4rem 0 0;
      color: var(--muted);
      font-size: 0.92rem;
      overflow-wrap: anywhere;
    }

    .note a {
      color: var(--mark);
      font-weight: 700;
      text-underline-offset: 0.15em;
    }

        --mark: #d4e08a;

        --hairline: rgba(212, 224, 138, 0.3);

        --fill: #3a1828;

        --soft: #f0b8cc;

        --mark-ink: #102016;

      }

      .cat-card {
        --fill: #332616;
        --ink: #fbe7c4;
        --soft: #e2c8a0;
        --mark: #f0c27a;
        --mark-ink: #2a1c0c;

      }
    }

    .gate { margin: 0 auto 1.25rem; max-width: 22rem; }
    .gate[hidden] { display: none; }
    .gate form {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 1.35rem;
      padding: 1.15rem;
    }
    .gate h2 {
      margin: 0 0 0.85rem;
      font-family: var(--sans);
      font-size: 1.35rem;
      font-weight: 800;
    }
    .gate label { display: block; margin-bottom: 0.4rem; font-size: 0.88rem; color: var(--muted); }
    .gate input {
      width: 100%;
      min-height: 2.75rem;
      padding: 0.55rem 0.75rem;
      border: 1px solid var(--line);
      border-radius: 0.7rem;
      background: var(--bg);
      color: var(--fg);
      font: inherit;
    }
    .gate button {
      width: 100%;
      min-height: 2.75rem;
      margin-top: 0.7rem;
      border: 0;
      border-radius: 999px;
      background: var(--mast);
      color: var(--mast-fg);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .gate button:disabled { opacity: 0.6; cursor: default; }
    .gate input:focus-visible,
    .gate button:focus-visible {
      outline: 2px solid var(--urgent);
      outline-offset: 2px;
    }
    .gate-error { margin: 0.7rem 0 0; color: #8d2f2f; min-height: 1.2em; }
    @media (prefers-color-scheme: dark) {
      .gate-error { color: #f0b4b4; }
    }

    #desk[hidden] { display: none; }

    @media (max-width: 640px) {
      .masthead { padding: 1.45rem 0 1.2rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
    }
  </style>
</head>

  <script>
    const CATEGORIES = [
      { name: "AI 免費額度", id: "cat-ai", className: "cat-ai", icon: "icon-ai" },
      { name: "電商檔期", id: "cat-mall", className: "cat-mall", icon: "icon-mall" },
      { name: "居家生活", id: "cat-home", className: "cat-home", icon: "icon-home" },
      { name: "吃喝", id: "cat-eat", className: "cat-eat", icon: "icon-eat" },
      { name: "軟體訂閱", id: "cat-soft", className: "cat-soft", icon: "icon-soft" },
      { name: "保健／海外", id: "cat-health", className: "cat-health", icon: "icon-health" },
      { name: "刷卡回饋", id: "cat-card", className: "cat-card", icon: "icon-card" },
    ];

    const NOTE_LINK = /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g;

    function taipeiParts(date) {
      const fmt = new Intl.DateTimeFormat("en-US", {
        timeZone: "Asia/Taipei",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        hourCycle: "h23",
      });
      const bag = {};
      for (const part of fmt.formatToParts(date)) {
        if (part.type !== "literal") bag[part.type] = part.value;
      }
      if (bag.hour === "24") bag.hour = "00";
      return bag;
    }

    function pad(value) {
      return String(value).padStart(2, "0");
    }

    function expiryInstant(value) {
      if (value == null || value === "") return null;
      const text = String(value).trim();
      const dateOnly = /^(\d{4})-(\d{2})-(\d{2})$/.exec(text);
      if (dateOnly) {
        const year = Number(dateOnly[1]);
        const month = Number(dateOnly[2]);
        const day = Number(dateOnly[3]);
        return new Date(Date.UTC(year, month - 1, day, 16, 0, 0));
      }
      const parsed = new Date(text);
      if (Number.isNaN(parsed.getTime())) return null;
      return parsed;
    }

    function isExpired(value, now) {
      const end = expiryInstant(value);
      if (!end) return false;
      return now.getTime() >= end.getTime();
    }

    function calendarDay(year, month, day) {
      return Date.UTC(year, month - 1, day) / 86400000;
    }

    function expiryInfo(value, now) {
      const empty = { text: "", tone: "", within24h: false, sort: Number.POSITIVE_INFINITY };
      if (value == null || value === "") return empty;
      const end = expiryInstant(value);
      if (!end) return empty;
      const text = String(value).trim();
      const dateOnly = /^(\d{4})-(\d{2})-(\d{2})$/.exec(text);
      let year;
      let month;
      let day;
      let hour;
      let minute;
      if (dateOnly) {
        year = Number(dateOnly[1]);
        month = Number(dateOnly[2]);
        day = Number(dateOnly[3]);
        hour = 23;
        minute = 59;
      } else {
        const parts = taipeiParts(end);
        year = Number(parts.year);
        month = Number(parts.month);
        day = Number(parts.day);
        hour = Number(parts.hour);
        minute = Number(parts.minute);
      }
      const today = taipeiParts(now);
      const isToday = Number(today.year) === year && Number(today.month) === month && Number(today.day) === day;
      const endOfDay = !!dateOnly || (hour === 23 && minute >= 59);
      const dayDiff = calendarDay(year, month, day) - calendarDay(Number(today.year), Number(today.month), Number(today.day));
      const within24h = end.getTime() - now.getTime() <= 24 * 60 * 60 * 1000;
      let label;
      if (isToday && endOfDay) label = "今天截止";
      else if (isToday) label = `今天 ${pad(hour)}:${pad(minute)} 截止`;
      else if (endOfDay && dayDiff >= 1 && dayDiff <= 6) label = `剩 ${dayDiff} 天`;
      else if (endOfDay) label = `到 ${month}/${day}`;
      else label = `到 ${month}/${day} ${pad(hour)}:${pad(minute)}`;
      let tone = "later";
      if (within24h || isToday) tone = "urgent";
      else if (dayDiff >= 1 && dayDiff <= 6) tone = "soon";
      return { text: label, tone, within24h, sort: end.getTime() };
    }

    function formatUpdated(iso) {
      const parsed = new Date(iso);
      if (Number.isNaN(parsed.getTime())) return "";
      const parts = taipeiParts(parsed);
      return `${parts.year}-${parts.month}-${parts.day} ${parts.hour}:${parts.minute}`;
    }

    function icon(id) {
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("aria-hidden", "true");
      const use = document.createElementNS("http://www.w3.org/2000/svg", "use");
      use.setAttribute("href", "#" + id);
      svg.append(use);
      return svg;
    }

    function fillNote(element, note) {
      element.replaceChildren();
      NOTE_LINK.lastIndex = 0;
      let last = 0;
      for (const match of note.matchAll(NOTE_LINK)) {
        if (match.index > last) element.append(document.createTextNode(note.slice(last, match.index)));
        const link = document.createElement("a");
        link.href = match[2];
        link.rel = "noopener noreferrer";
        link.textContent = match[1];
        element.append(link);
        last = match.index + match[0].length;
      }
      if (last < note.length) element.append(document.createTextNode(note.slice(last)));
    }

    const ALL_TAB = { name: "全部", id: "all", className: "chip-all", icon: "icon-all" };

    function tabIdFromHash() {
      let raw = "";
      try { raw = decodeURIComponent(location.hash.replace(/^#/, "")); }
      catch (error) { raw = ""; }
      return raw || ALL_TAB.id;
    }

    function revealTab(tab) {
      const scroller = document.getElementById("chips");
      const tabBox = tab.getBoundingClientRect();
      const box = scroller.getBoundingClientRect();
      if (tabBox.width === 0 || box.width === 0) return;
      if (tabBox.left < box.left + 4) scroller.scrollLeft -= box.left - tabBox.left + 8;
      else if (tabBox.right > box.right - 4) scroller.scrollLeft += tabBox.right - box.right + 8;
    }

    function applyTab(requested) {
      const sections = [...document.querySelectorAll("#sections section")];
      const known = new Set(sections.map((section) => section.dataset.tab));
      const active = requested !== ALL_TAB.id && known.has(requested) ? requested : ALL_TAB.id;
      if (requested !== ALL_TAB.id && active === ALL_TAB.id && location.hash && location.hash !== "#all") {
        history.replaceState(null, "", "#all");
      }
      for (const section of sections) {
        section.hidden = !(active === ALL_TAB.id || section.dataset.tab === active);
      }
      for (const tab of document.querySelectorAll("#chips [role='tab']")) {
        const on = tab.dataset.tab === active;
        tab.setAttribute("aria-selected", on ? "true" : "false");
        tab.tabIndex = on ? 0 : -1;
        if (on) revealTab(tab);
      }
    }

    function selectTab(id) {
      const hash = `#${id}`;
      if (location.hash !== hash) history.pushState(null, "", hash);
      applyTab(id);
    }

    function makeTab(category) {
      const link = document.createElement("a");
      link.className = category.className ? `chip ${category.className}` : "chip";
      link.href = `#${category.id}`;
      link.id = `tab-${category.id}`;
      link.dataset.tab = category.id;
      link.setAttribute("role", "tab");
      link.setAttribute("aria-selected", "false");
      link.tabIndex = -1;
      if (category.id !== ALL_TAB.id) link.setAttribute("aria-controls", `panel-${category.id}`);
      if (category.icon) {
        const mark = document.createElement("span");
        mark.className = "mark";
        mark.append(icon(category.icon));
        link.append(mark);
      }
      link.append(document.createTextNode(category.name));
      return link;
    }

    function makeTitle(deal) {
      const href = String(deal.href || "");
      const safe = /^https?:\/\//i.test(href);
      const element = document.createElement(safe ? "a" : "span");
      element.className = "title-link";
      if (safe) {
        element.href = href;
        element.rel = "noopener noreferrer";
      }
      element.textContent = String(deal.title || "");
      return element;
    }

    function byDeadline(items, now) {
      return items
        .map((deal, index) => ({ deal, index, info: expiryInfo(deal.expires, now) }))
        .sort((a, b) => {
          if (a.info.within24h !== b.info.within24h) return a.info.within24h ? -1 : 1;
          if (a.info.sort !== b.info.sort) return a.info.sort - b.info.sort;
          return a.index - b.index;
        });
    }

    function makeDeal(deal, now) {
      const info = expiryInfo(deal.expires, now);
      const item = document.createElement("li");
      if (info.tone === "urgent") item.classList.add("is-urgent");
      if (info.text) {
        const expiry = document.createElement("p");
        expiry.className = `expiry is-${info.tone}`;
        expiry.textContent = info.text;
        item.append(expiry);
      }
      item.append(makeTitle(deal));
      const noteText = deal.note == null ? "" : String(deal.note);
      if (noteText) {
        const note = document.createElement("p");
        note.className = "note";
        fillNote(note, noteText);
        item.append(note);
      }
      return item;
    }

    function makeSection(category, items, now) {
      const section = document.createElement("section");
      section.id = `panel-${category.id}`;
      section.dataset.tab = category.id;
      section.className = category.className && category.className.startsWith("cat-")
        ? `group ${category.className}`
        : "group";
      section.setAttribute("role", "tabpanel");
      section.setAttribute("aria-labelledby", `tab-${category.id}`);
      const heading = document.createElement("h2");
      const mark = document.createElement("span");
      mark.className = "mark";
      mark.append(icon(category.icon));
      heading.append(mark, document.createTextNode(category.name));
      const list = document.createElement("ul");
      list.className = "deals";
      for (const entry of byDeadline(items, now)) list.append(makeDeal(entry.deal, now));
      section.append(heading, list);
      return section;
    }

    function render(deals) {
      const now = new Date();
      const visible = [];
      let newest = "";
      for (const deal of deals) {
        if (!deal || typeof deal !== "object") continue;
        const added = typeof deal.added === "string" ? deal.added : "";
        if (added > newest) newest = added;
        if (isExpired(deal.expires, now)) continue;
        visible.push(deal);
      }

      const when = newest ? formatUpdated(newest) : "";
      document.getElementById("updated").textContent = when
        ? `最後更新 ${when}（台北） · ${visible.length} 則`
        : `最後更新 — · ${visible.length} 則`;

      const groups = new Map(CATEGORIES.map((category) => [category.name, []]));
      const extras = [];
      for (const deal of visible) {
        const name = String(deal.category || "");
        if (groups.has(name)) groups.get(name).push(deal);
        else extras.push(deal);
      }

      const chips = document.getElementById("chips");
      const sections = document.getElementById("sections");
      chips.replaceChildren();
      sections.replaceChildren();

      const present = [];
      for (const category of CATEGORIES) {
        const items = groups.get(category.name);
        if (!items.length) continue;
        present.push({ category, items });
      }
      if (extras.length) {
        present.push({
          category: { name: "其他", id: "cat-extra", className: "", icon: "icon-card" },
          items: extras,
        });
      }

      if (present.length) chips.append(makeTab(ALL_TAB));
      for (const entry of present) {
        chips.append(makeTab(entry.category));
        sections.append(makeSection(entry.category, entry.items, now));
      }

      document.querySelector(".chips-bar").hidden = present.length === 0;
      document.getElementById("empty").hidden = present.length !== 0;
      if (present.length) applyTab(tabIdFromHash());
    }

    async function loadDeals() {
      const status = document.getElementById("status");
      status.hidden = true;
      try {
        const response = await fetch("deals.json", { cache: "no-store" });
        if (!response.ok) throw new Error(String(response.status));
        const data = await response.json();
        if (!Array.isArray(data)) throw new Error("format");
        render(data);
      } catch (error) {
        status.hidden = false;
        status.textContent = "讀不到優惠清單。";
      }
    }

    const GATE_SALT = "mv24FYlAQXqzWPt+kNbhdw==";
    const GATE_ITERATIONS = 200000;
    const GATE_HASH = "3xAExdNY8/ArB2V6OVaNLkCIqCfvftk81PIMvdj9sIM=";
    const GATE_KEY = "link-hub-gate";

    function gateBytes(b64) {
      const bin = atob(b64);
      const out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i += 1) out[i] = bin.charCodeAt(i);
      return out;
    }

    function remembered() {
      try { return localStorage.getItem(GATE_KEY) === GATE_HASH; }
      catch (error) { return false; }
    }

    function remember() {
      try { localStorage.setItem(GATE_KEY, GATE_HASH); }
      catch (error) { /* 私密模式就每次再問 */ }
    }

    async function passwordMatches(password) {
      const material = await crypto.subtle.importKey(
        "raw",
        new TextEncoder().encode(password),
        "PBKDF2",
        false,
        ["deriveBits"]
      );
      const bits = await crypto.subtle.deriveBits({
        name: "PBKDF2",
        salt: gateBytes(GATE_SALT),
        iterations: GATE_ITERATIONS,
        hash: "SHA-256",
      }, material, 256);
      const got = new Uint8Array(bits);
      const expected = gateBytes(GATE_HASH);
      if (got.length !== expected.length) return false;
      let diff = 0;
      for (let i = 0; i < got.length; i += 1) diff |= got[i] ^ expected[i];
      return diff === 0;
    }

    function openDesk() {
      document.getElementById("gate").hidden = true;
      document.getElementById("desk").hidden = false;
      loadDeals();
    }

    const chipsNav = document.getElementById("chips");
    chipsNav.addEventListener("click", (event) => {
      const tab = event.target.closest("[role='tab']");
      if (!tab || !chipsNav.contains(tab)) return;
      event.preventDefault();
      selectTab(tab.dataset.tab);
    });
    chipsNav.addEventListener("keydown", (event) => {
      const tabs = [...chipsNav.querySelectorAll("[role='tab']")];
      const index = tabs.indexOf(document.activeElement);
      if (index < 0) return;
      let nextIndex = null;
      if (event.key === "ArrowRight") nextIndex = (index + 1) % tabs.length;
      else if (event.key === "ArrowLeft") nextIndex = (index - 1 + tabs.length) % tabs.length;
      else if (event.key === "Home") nextIndex = 0;
      else if (event.key === "End") nextIndex = tabs.length - 1;
      if (nextIndex == null) return;
      event.preventDefault();
      const next = tabs[nextIndex];
      selectTab(next.dataset.tab);
      next.focus();
    });
    window.addEventListener("hashchange", () => applyTab(tabIdFromHash()));
    window.addEventListener("popstate", () => applyTab(tabIdFromHash()));

    const gateForm = document.getElementById("gate-form");
    gateForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const input = document.getElementById("gate-password");
      const error = document.getElementById("gate-error");
      const button = gateForm.querySelector("button");
      error.hidden = true;
      button.disabled = true;
      try {
        const ok = await passwordMatches(input.value);
        if (!ok) {
          error.hidden = false;
          input.focus();
          return;
        }
        input.value = "";
        remember();
        openDesk();
      } catch (gateError) {
        error.hidden = false;
      } finally {
        button.disabled = false;
      }
    });

    if (remembered()) openDesk();
  </script>
</body>
</html>
